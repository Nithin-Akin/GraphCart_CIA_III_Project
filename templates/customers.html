{% extends 'base.html' %}{% block content %}<div class="row g-4"><div class="col-lg-4"><div class="content-box"><h2>{{ 'Edit Customer' if edit else 'Add Customer' }}</h2><form method="post"><input type="hidden" name="id" value="{{ edit.id if edit else '' }}"><label class="form-label">Name</label><input class="form-control mb-2" name="name" required value="{{ edit.name if edit else '' }}"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required value="{{ edit.email if edit else '' }}"><button class="btn btn-primary">Save Customer</button>{% if edit %}<a class="btn btn-outline-secondary" href="/customers">Cancel</a>{% endif %}</form></div></div><div class="col-lg-8"><h1>Customers and Purchase History</h1><div class="table-responsive"><table class="table table-hover bg-white"><thead><tr><th>Customer</th><th>Email</th><th>Purchases</th><th>Add purchase</th><th></th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.purchases }}</td><td><form class="d-flex gap-1" method="post" action="/customers/{{ c.id }}/purchase"><select class="form-select form-select-sm" name="product_id">{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select><input class="form-control form-control-sm qty" type="number" min="1" value="1" name="quantity"><button class="btn btn-sm btn-success">Add</button></form></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" href="/customers?edit={{ c.id }}">Edit</a><form class="d-inline" method="post" action="/customers/{{ c.id }}/delete"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
