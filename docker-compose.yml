services:
  neo4j:
    image: neo4j:5-community
    container_name: ecommerce-neo4j
    environment:
      NEO4J_AUTH: neo4j/cia3project
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build: .
    container_name: ecommerce-graph-web
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cia3project
      SECRET_KEY: cia3-demo-secret
    ports:
      - "5001:5000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
